name: CI and container delivery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

env:
  OMP_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  MPLBACKEND: Agg

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install verified dependencies
        run: python -m pip install -r requirements-serving.txt -e ".[dev]"
      - name: Lint runtime and tests
        run: python -m ruff check --select E9,F63,F7,F82 src scripts tests
      - name: Behavioral tests
        run: python -m pytest -q --tb=short

  container:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install reproducible pipeline dependencies
        run: python -m pip install -r requirements-serving.txt -e ".[data]"
      - name: Generate synthetic raw data
        run: python scripts/generate_data.py
      - name: Build frozen model recipe without holdout evaluation
        run: python scripts/build_model.py
      - name: Verify training reference and controlled drift reports
        run: python scripts/demo_drift.py
      - name: Build image
        run: docker build --tag claim-fraud-api:ci .
      - name: Start and verify container
        run: |
          docker run --detach --name claim-fraud-ci --publish 127.0.0.1:8000:8000 claim-fraud-api:ci
          python scripts/wait_api.py
          python scripts/smoke_api.py
      - name: Publish tested image to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          $image = "ghcr.io/$($env:GH_REPOSITORY.ToLower())"
          $env:GH_TOKEN | docker login ghcr.io --username $env:GH_ACTOR --password-stdin
          if ($LASTEXITCODE -ne 0) { throw 'Registry login failed' }
          docker tag claim-fraud-api:ci "${image}:$env:GH_SHA"
          docker tag claim-fraud-api:ci "${image}:latest"
          docker push "${image}:$env:GH_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Commit image publication failed' }
          docker push "${image}:latest"
          if ($LASTEXITCODE -ne 0) { throw 'Latest image publication failed' }
      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs --tail 40 claim-fraud-ci
          docker rm --force claim-fraud-ci
